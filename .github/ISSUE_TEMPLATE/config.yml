# GitHub issue-template configuration. Blank issues stay enabled on purpose
# (docs/operations/collaboration.md documents them as an escape hatch).
# GitHub Discussions is not enabled for this repository, so questions that do
# not fit the bug / feature forms are routed through the contact links below.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/nwverse/persona/security/advisories/new
    about: >-
      Private reporting only. Never open a public issue for a vulnerability;
      see SECURITY.md for what a good report contains.
  - name: Usage question or setup help
    url: https://github.com/nwverse/persona/blob/main/docs/operations/getting-started.md
    about: >-
      Installation, deployment and everyday usage are covered in the docs;
      check here before opening an issue.
  - name: Code of conduct report
    url: https://github.com/nwverse/persona/security/advisories/new
    about: >-
      Private channel for reporting abusive, harassing or otherwise
      unacceptable behavior; open the report with "Code of conduct".
