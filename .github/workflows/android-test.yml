name: Machines large-text evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Capture existing Machines cases at 200 percent font scale
        working-directory: android
        run: ./gradlew :feature:machines:testDebugUnitTest --tests persona.feature.machines.MachinesManagersShotsTest --no-daemon --max-workers=2
      - name: Upload large-text evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machines-android-large-text
          retention-days: 7
          if-no-files-found: error
          path: |
            android/feature/machines/build/managers-shots/*.png
            android/feature/machines/build/test-results/testDebugUnitTest/
