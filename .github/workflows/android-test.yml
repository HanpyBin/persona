name: Machines multi-hub behavioral regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run failed-manager multi-hub regression
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests persona.android.di.MergedMetricsTest --no-daemon --max-workers=2
      - name: Upload behavioral regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machines-multi-hub-regression
          retention-days: 7
          if-no-files-found: error
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
