name: External origin grouping behavioral regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  origin-grouping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Restore public Robolectric runtime dependencies
        id: robolectric
        uses: actions/cache/restore@v4
        with:
          # Never cache Maven settings, credentials or unrelated/private artifacts.
          path: |
            ~/.m2/repository/org/robolectric/android-all
            ~/.m2/repository/org/robolectric/android-all-instrumented
          key: ${{ runner.os }}-robolectric-v1-test-1-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          # Another lane's entry, or one saved under an old lane name, holds the same public jars: better than a download.
          restore-keys: |
            ${{ runner.os }}-robolectric-v1-test-1-
            ${{ runner.os }}-robolectric-v1-
      - name: Reproduce trimmed external origin grouping
        working-directory: android
        run: >-
          ./gradlew :feature:assistant:testDebugUnitTest
          --tests persona.feature.assistant.AssistantTest.trimmedExternalOriginsKeepTheirNamedAutomaticGroups
          --no-daemon --no-watch-fs --console=plain --max-workers=2
          -PpersonaApplicationId=com.example.persona
          -PpersonaGoogleOAuthScheme=persona.oauth.unset
          -PpersonaRepoRoot="$GITHUB_WORKSPACE"
      - name: Upload behavioral regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-origin-grouping-regression
          retention-days: 7
          if-no-files-found: error
          path: |
            android/feature/assistant/build/test-results/testDebugUnitTest/
            android/feature/assistant/build/reports/tests/testDebugUnitTest/
